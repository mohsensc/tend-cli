name: tend
description: Dependabot for breaking API changes, with proof.
branding:
  icon: refresh-cw
  color: green
inputs:
  token:
    description: Token with contents:write and pull-requests:write. The default token cannot start other workflows or push workflow changes; pass a fine-grained or GitHub App token for those
    default: ${{ github.token }}
  command:
    description: run | check
    default: run
  args:
    description: Extra CLI arguments
    default: ""
  config:
    description: Path to tend.yml
    default: ""
  version:
    description: tend version to install; default is the latest release of this action's major
    default: ""
  model-key:
    description: API key for the model provider named in tend.yml
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TEND_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/action/install.sh" "$TEND_VERSION"'
    # tend pushes with the token it is given. A token that actions/checkout
    # left in the repository's config would be readable by the project's own
    # install and test commands, so it goes, whatever the checkout step says.
    - shell: bash
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
        git config --local --get-regexp '^includeif\..*\.path$' 2>/dev/null | while read -r key val; do
          case "$val" in *git-credentials*) git config --local --unset-all "$key" ;; esac
        done || true
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tend/repos
        key: tend-${{ github.repository }}-${{ github.run_id }}
        restore-keys: tend-${{ github.repository }}-
    # The user cache dir differs per OS, so state goes where the cache steps look.
    - shell: bash
      env:
        TEND_HOME: ${{ runner.temp }}/tend
        GITHUB_TOKEN: ${{ inputs.token }}
        TEND_DEFAULT_TOKEN: ${{ inputs.token == github.token }}
        TEND_MODEL_KEY: ${{ inputs.model-key }}
        TEND_CONFIG: ${{ inputs.config }}
        TEND_COMMAND: ${{ inputs.command }}
        TEND_ARGS: ${{ inputs.args }}
      run: tend "$TEND_COMMAND" $TEND_ARGS
    - if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/tend/repos
        key: tend-${{ github.repository }}-${{ github.run_id }}
