name: tend

# Runs the action from this checkout on this repository. Its PRs only start
# ci.yml when TEND_TOKEN holds a GitHub App or fine-grained token; with the
# default token, "Allow GitHub Actions to create and approve pull requests"
# has to be on and the PRs get no CI.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: tend
  cancel-in-progress: false

jobs:
  tend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: ./
        with:
          token: ${{ secrets.TEND_TOKEN || github.token }}
          model-key: ${{ secrets.TEND_MODEL_KEY }}
