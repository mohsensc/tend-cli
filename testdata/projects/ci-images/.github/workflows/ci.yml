name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v2
      - id: meta
        run: echo "::set-output name=sha::$(git rev-parse HEAD)"
      - run: node --check server.js
