openapi: 3.0.3
info:
  title: Fixture
  version: 1.0.0
servers:
  - url: https://api.fixture.dev
paths:
  /v1/orders:
    get:
      summary: List orders
      parameters:
        - {name: status, in: query}
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
  /v1/orders/{id}/legacy:
    get:
      summary: Fetch an order in the old format
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegacyOrder'}
components:
  schemas:
    Order:
      type: object
      properties:
        id: {type: string}
        status: {type: string}
        total_cents: {type: integer}
    LegacyOrder:
      type: object
      properties:
        id: {type: string}
        amount: {type: integer}
